name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes --title "Release $TAG"

      - name: Download existing DB (warm start)
        run: |
          mkdir -p /tmp/vulnscan-ci
          gh release download db-latest -p db.sqlite.gz -D /tmp/vulnscan-ci/ 2>/dev/null && \
          gunzip -f /tmp/vulnscan-ci/db.sqlite.gz || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run full advisory sync
        run: node dist/cli.js update
        env:
          VULNSCAN_DB_PATH: /tmp/vulnscan-ci/db.sqlite
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VULNSCAN_NO_BOOTSTRAP: 1

      - name: Create db-latest release if missing
        run: gh release view db-latest || gh release create db-latest --title "Advisory Database (latest)" --notes "Refreshed daily by CI"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gzip the database
        run: gzip -k /tmp/vulnscan-ci/db.sqlite && mv /tmp/vulnscan-ci/db.sqlite.gz db.sqlite.gz

      - name: Upload DB to db-latest release
        run: gh release upload db-latest db.sqlite.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
